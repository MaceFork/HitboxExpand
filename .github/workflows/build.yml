name: Build Hitbox Expand JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'HitboxExpand-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source project
        run: |
          mkdir -p project
          unzip -o HitboxExpand-Source.zip -d extracted
          cp -R extracted/HitboxExpand-Source/. project/
          test -f project/build.gradle

      - name: Build Fabric mod
        working-directory: project
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: HitboxExpand-JAR
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
          
